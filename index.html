<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a2e;font-family:'SF Pro Display',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;top:0;left:0}
#overlay{display:none;position:fixed;inset:0;background:rgba(10,10,30,0.94);z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#overlay.show{display:flex}
#overlay h2{font-size:32px;font-weight:900;color:#fff;letter-spacing:2px}
#overlay .stars{font-size:48px;letter-spacing:8px}
#overlay .sub{font-size:16px;color:rgba(255,255,255,0.5)}
#overlay button{padding:16px 44px;font-size:17px;font-weight:800;border:none;border-radius:30px;cursor:pointer;color:#1a1a2e;letter-spacing:1px}
#overlay .btn-next{background:linear-gradient(135deg,#feca57,#ff6b6b);box-shadow:0 6px 20px rgba(255,107,107,0.4)}
#overlay .btn-retry{background:rgba(255,255,255,0.15);color:#fff;box-shadow:none}
#overlay .btn-menu{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);box-shadow:none;font-size:14px;padding:10px 30px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h2 id="overlay-title">LEVEL COMPLETE</h2>
  <div class="stars" id="overlay-stars"></div>
  <div class="sub" id="overlay-sub"></div>
  <button class="btn-next" id="btn-next">Next Level</button>
  <button class="btn-retry" id="btn-retry">Retry</button>
  <button class="btn-menu" id="btn-menu">Level Select</button>
</div>
<script>
const GRID=5,CLEAR_THRESHOLD=3;

const COLORS=[
  {fill:'#ff6b6b',light:'#ff9999',dark:'#e04040',glow:'rgba(255,107,107,0.6)'},
  {fill:'#48dbfb',light:'#7be7ff',dark:'#1cb5e0',glow:'rgba(72,219,251,0.6)'},
  {fill:'#feca57',light:'#ffdd80',dark:'#e0a800',glow:'rgba(254,202,87,0.6)'},
  {fill:'#55efc4',light:'#81f5d8',dark:'#2bc4a0',glow:'rgba(85,239,196,0.6)'},
  {fill:'#a55eea',light:'#c89df5',dark:'#8134d4',glow:'rgba(165,94,234,0.6)'},
  {fill:'#ff9f43',light:'#ffbe76',dark:'#e07c20',glow:'rgba(255,159,67,0.6)'},
];

const BG_TOP='#1a1a2e',BG_BOT='#16213e',BOARD_BG='#0f3460';
const ACCENT='#feca57',TEXT_DIM='rgba(255,255,255,0.5)';

let board,moves,par,levelNum,tilesLeft,isAnimating,gameState;
// gameState: 'menu' | 'play' | 'win' | 'fail'
let particles=[],floats=[],sparks=[],rings=[],shakeAmt=0,flashAmt=0,pulsePhase=0;
let dragStart=null,dragCurrent=null;
let drops,selectedDrop,hoverCell;
let W,H,cs,bpx,bx,by,invY;
let highScores; // {[level]: stars}
let menuScroll=0;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');

function layout(){
  const dpr=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const hdr=90,pad=16,invSpace=70;
  const avail=Math.min(W-pad*2,H-hdr-invSpace-pad*2,380);
  cs=Math.floor(avail/GRID);
  bpx=cs*GRID;
  bx=Math.floor((W-bpx)/2);
  by=hdr;
  invY=by+bpx+16;
}

// ── Level Generation ──
// Levels built by placing tile groups then scrambling with random UNIQUE slides.
// Par = exact number of scramble moves (the known minimum solution).
// Extra scrambles added to fix accidental matches also count.

function generateLevel(num){
  const b=Array.from({length:GRID},()=>Array(GRID).fill(null));

  // Params scale with level — more tiles, more colors, more scrambles
  const nc=Math.min(3+Math.floor(num/8),6);
  const numGroups=Math.min(3+Math.floor(num/2),8);
  const groupSize=3;
  const baseScrambles=Math.min(3+Math.floor(num*1.2),25);

  // Place groups of same-colored tiles
  let placed=0;
  for(let g=0;g<numGroups&&placed<GRID*GRID-2;g++){
    const color=g%nc;
    let attempts=0;
    while(attempts<50){
      attempts++;
      const sr=Math.floor(Math.random()*GRID),sc=Math.floor(Math.random()*GRID);
      if(b[sr][sc]!==null) continue;

      const cells=[{r:sr,c:sc}];
      b[sr][sc]=color;

      for(let i=1;i<groupSize;i++){
        const dirs=[[0,1],[0,-1],[1,0],[-1,0]];
        for(let d=dirs.length-1;d>0;d--){const j=Math.floor(Math.random()*(d+1));[dirs[d],dirs[j]]=[dirs[j],dirs[d]];}
        let grew=false;
        for(const cell of [...cells]){
          for(const [dr,dc] of dirs){
            const nr=cell.r+dr,ncc=cell.c+dc;
            if(nr>=0&&nr<GRID&&ncc>=0&&ncc<GRID&&b[nr][ncc]===null){
              b[nr][ncc]=color;
              cells.push({r:nr,c:ncc});
              grew=true;
              break;
            }
          }
          if(grew) break;
        }
        if(!grew) break;
      }

      if(cells.length>=groupSize){placed+=cells.length;break;}
      else{for(const c of cells) b[c.r][c.c]=null;}
    }
  }

  // Scramble with unique random slides — avoid undoing the previous move
  let totalMoves=0;
  let lastAxis=null,lastIdx=-1,lastDir=0;
  for(let s=0;s<baseScrambles;s++){
    let axis,idx,dir;
    // Pick a move that isn't the exact reverse of the last one
    do{
      axis=Math.random()<0.5?'row':'col';
      idx=Math.floor(Math.random()*GRID);
      dir=Math.random()<0.5?1:-1;
    }while(axis===lastAxis&&idx===lastIdx&&dir===-lastDir);
    if(axis==='row') wrapRow(b,idx,dir); else wrapCol(b,idx,dir);
    lastAxis=axis;lastIdx=idx;lastDir=dir;
    totalMoves++;
  }

  // Fix accidental matches — each fix adds to the move count
  let safety=0;
  while(findClearsOn(b).length>0&&safety<50){
    const row=Math.floor(Math.random()*GRID);
    wrapRow(b,row,1);
    totalMoves++;
    safety++;
  }

  // Par IS the scramble count — the exact minimum to reverse the scramble
  return{board:b,par:totalMoves,numColors:nc};
}

function wrapRow(b,row,dir){
  if(dir===1){
    const last=b[row][GRID-1];
    for(let c=GRID-1;c>0;c--) b[row][c]=b[row][c-1];
    b[row][0]=last;
  } else {
    const first=b[row][0];
    for(let c=0;c<GRID-1;c++) b[row][c]=b[row][c+1];
    b[row][GRID-1]=first;
  }
}

function wrapCol(b,col,dir){
  if(dir===1){
    const last=b[GRID-1][col];
    for(let r=GRID-1;r>0;r--) b[r][col]=b[r-1][col];
    b[0][col]=last;
  } else {
    const first=b[0][col];
    for(let r=0;r<GRID-1;r++) b[r][col]=b[r+1][col];
    b[GRID-1][col]=first;
  }
}

function findClearsOn(b){
  const visited=Array.from({length:GRID},()=>Array(GRID).fill(false));
  const groups=[];
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    if(visited[r][c]||b[r][c]===null) continue;
    const color=b[r][c];
    const grp=[],stk=[{r,c}];visited[r][c]=true;
    while(stk.length){
      const{r:cr,c:cc}=stk.pop();grp.push({r:cr,c:cc});
      for(const[dr,dc]of[[0,1],[0,-1],[1,0],[-1,0]]){
        const nr=cr+dr,nc=cc+dc;
        if(nr<0||nr>=GRID||nc<0||nc>=GRID||visited[nr][nc]||b[nr][nc]===null) continue;
        if(b[nr][nc]===color){visited[nr][nc]=true;stk.push({r:nr,c:nc});}
      }
    }
    if(grp.length>=CLEAR_THRESHOLD) groups.push(grp);
  }
  return groups;
}

// ── Game Board Operations ──
function slideRowWrap(row,dir){
  wrapRow(board,row,dir);
}

function slideColWrap(col,dir){
  wrapCol(board,col,dir);
}

function executeSlide(axis,idx,dir){
  if(isAnimating||selectedDrop!==null||gameState!=='play') return;
  if(axis==='row') slideRowWrap(idx,dir);
  else if(axis==='col') slideColWrap(idx,dir);
  else if(axis==='diag'){
    slideRowWrap(idx.row,dir.dx);
    slideColWrap(idx.col,dir.dy);
  }
  moves++;
  processClearsChain();
}

function countTiles(){
  let n=0;
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++) if(board[r][c]!==null) n++;
  return n;
}

function processClearsChain(){
  const groups=findClearsOn(board);
  if(groups.length===0){
    isAnimating=false;
    // Check win/fail
    tilesLeft=countTiles();
    if(tilesLeft===0) winLevel();
    else if(moves>=par+5) {} // Allow going over par, no hard fail
    return;
  }
  isAnimating=true;
  let total=0;

  for(const grp of groups){
    for(const{r,c}of grp){
      if(board[r][c]===null) continue;
      const ci=board[r][c];
      spawnPop(r,c,ci);
      // Collect drop
      if(!drops[ci]) drops[ci]=true;
      board[r][c]=null;
      total++;
    }
  }

  if(total>=5){
    shakeAmt=Math.min(12,total*2);
    flashAmt=0.1;
    rings.push({x:W/2,y:by+bpx/2,r:0,maxR:bpx*0.4,life:1,color:'rgba(255,255,255,0.3)'});
  }

  floats.push({x:W/2,y:by+bpx/2,text:`-${total}`,t:1.0,big:total>=5,color:'#fff'});

  // After clear, check for chain reactions (tiles may have shifted adjacency due to wrapping)
  setTimeout(()=>{
    if(findClearsOn(board).length>0) processClearsChain();
    else{
      isAnimating=false;
      tilesLeft=countTiles();
      if(tilesLeft===0) winLevel();
    }
  },300);
}

function useDrop(r,c,dropColor){
  if(board[r][c]===null) return; // can't paint empty
  board[r][c]=dropColor;
  const cx=bx+c*cs+cs/2,cy=by+r*cs+cs/2;
  const col=COLORS[dropColor];
  spawnStarBurst(cx,cy,col.fill,12);
  rings.push({x:cx,y:cy,r:0,maxR:cs*1.5,life:1,color:col.fill});
  // Don't count as a move — it's a power-up
  isAnimating=true;
  setTimeout(()=>{
    if(findClearsOn(board).length>0) processClearsChain();
    else{isAnimating=false;tilesLeft=countTiles();if(tilesLeft===0)winLevel();}
  },200);
}

function winLevel(){
  gameState='win';
  const overPar=moves-par;
  const starsEarned=overPar<=0?3:overPar<=2?2:1;
  highScores[levelNum]=Math.max(highScores[levelNum]||0,starsEarned);
  localStorage.setItem('slide_scores',JSON.stringify(highScores));

  setTimeout(()=>{
    document.getElementById('overlay-title').textContent='LEVEL '+levelNum;
    document.getElementById('overlay-stars').textContent='★'.repeat(starsEarned)+'☆'.repeat(3-starsEarned);
    document.getElementById('overlay-stars').style.color=starsEarned===3?'#feca57':starsEarned===2?'#c8d6e5':'#8395a7';
    const subText=overPar<=0
      ?`${moves} moves — AT PAR!`
      :`${moves} moves — +${overPar} over par (${par})`;
    document.getElementById('overlay-sub').textContent=subText;
    document.getElementById('btn-next').style.display='';
    document.getElementById('overlay').classList.add('show');
  },600);
}

// ── Particles ──
function spawnPop(r,c,ci){
  if(ci===null||ci<0) return;
  const cx=bx+c*cs+cs/2,cy=by+r*cs+cs/2;
  const col=COLORS[ci];
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2,spd=3+Math.random()*6;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,life:1,color:col.fill,size:2+Math.random()*5});
  }
  for(let i=0;i<4;i++){
    const a=Math.random()*Math.PI*2,spd=2+Math.random()*4;
    sparks.push({x:cx,y:cy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1,life:1,color:col.light,size:3+Math.random()*2});
  }
}

function spawnStarBurst(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,spd=2+Math.random()*5;
    sparks.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1,life:1.2,color,size:3+Math.random()*3});
  }
}

// ── Input ──
const SWIPE_THRESHOLD=20;

function handleInputDown(mx,my){
  if(gameState==='menu'){handleMenuTap(mx,my);return;}
  if(gameState!=='play') return;
  if(handleDropletTap(mx,my)) return;
  if(selectedDrop!==null&&!isAnimating){
    const col=Math.floor((mx-bx)/cs),row=Math.floor((my-by)/cs);
    if(row>=0&&row<GRID&&col>=0&&col<GRID&&board[row][col]!==null){
      drops[selectedDrop]=false;
      useDrop(row,col,selectedDrop);
      selectedDrop=null;hoverCell=null;
      return;
    } else {selectedDrop=null;return;}
  }
  if(!isAnimating) dragStart={x:mx,y:my};
}

function handleInputMove(mx,my){
  if(dragStart) dragCurrent={x:mx,y:my};
  if(selectedDrop!==null&&!isAnimating){
    const col=Math.floor((mx-bx)/cs),row=Math.floor((my-by)/cs);
    if(row>=0&&row<GRID&&col>=0&&col<GRID) hoverCell={r:row,c:col};
    else hoverCell=null;
  }
}

canvas.addEventListener('mousedown',e=>handleInputDown(e.clientX,e.clientY));
canvas.addEventListener('mousemove',e=>handleInputMove(e.clientX,e.clientY));
canvas.addEventListener('mouseup',()=>{if(gameState==='play'&&selectedDrop===null)handleSwipe();dragStart=null;dragCurrent=null;});

canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];handleInputDown(t.clientX,t.clientY);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];handleInputMove(t.clientX,t.clientY);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();if(gameState==='play'&&selectedDrop===null)handleSwipe();dragStart=null;dragCurrent=null;},{passive:false});

function handleDropletTap(mx,my){
  const nc=Math.min(6,3+Math.floor(levelNum/10));
  const dropSize=36,gap=6;
  const totalW=nc*dropSize+(nc-1)*gap;
  const startX=Math.floor((W-totalW)/2);
  for(let i=0;i<nc;i++){
    const dx=startX+i*(dropSize+gap);
    if(mx>=dx&&mx<=dx+dropSize&&my>=invY&&my<=invY+dropSize){
      if(drops[i]){selectedDrop=(selectedDrop===i)?null:i;hoverCell=null;}
      return true;
    }
  }
  return false;
}

function handleSwipe(){
  if(!dragStart||isAnimating||selectedDrop!==null||gameState!=='play') return;
  const dx=dragCurrent?(dragCurrent.x-dragStart.x):0;
  const dy=dragCurrent?(dragCurrent.y-dragStart.y):0;
  const sc=Math.floor((dragStart.x-bx)/cs),sr=Math.floor((dragStart.y-by)/cs);

  if(Math.abs(dx)<SWIPE_THRESHOLD&&Math.abs(dy)<SWIPE_THRESHOLD) return;
  if(sr<0||sr>=GRID||sc<0||sc>=GRID) return;
  const adx=Math.abs(dx),ady=Math.abs(dy);
  const ratio=Math.min(adx,ady)/Math.max(adx,ady);
  if(ratio>0.4&&adx>SWIPE_THRESHOLD*0.7&&ady>SWIPE_THRESHOLD*0.7){
    executeSlide('diag',{row:sr,col:sc},{dx:dx>0?1:-1,dy:dy>0?1:-1});
  } else if(adx>ady) executeSlide('row',sr,dx>0?1:-1);
  else executeSlide('col',sc,dy>0?1:-1);
}

// ── Menu ──
function handleMenuTap(mx,my){
  const cols=4,cellW=70,cellH=70,gap=10;
  const gridW=cols*(cellW+gap)-gap;
  const startX=Math.floor((W-gridW)/2);
  const startY=120-menuScroll;
  const maxLevel=getMaxLevel();

  for(let i=0;i<50;i++){
    const row=Math.floor(i/cols),col=i%cols;
    const cx=startX+col*(cellW+gap),cy=startY+row*(cellH+gap);
    if(mx>=cx&&mx<=cx+cellW&&my>=cy&&my<=cy+cellH){
      if(i+1<=maxLevel){
        startLevel(i+1);
      }
      return;
    }
  }
}

function getMaxLevel(){
  let max=1;
  for(let i=1;i<=50;i++){
    if(highScores[i]&&highScores[i]>0) max=Math.max(max,i+1);
  }
  return Math.min(max,50);
}

function showMenu(){
  gameState='menu';
  document.getElementById('overlay').classList.remove('show');
}

function startLevel(num){
  levelNum=num;
  gameState='play';
  moves=0;isAnimating=false;
  selectedDrop=null;hoverCell=null;
  drops=Array(COLORS.length).fill(false);
  particles=[];floats=[];sparks=[];rings=[];shakeAmt=0;flashAmt=0;

  const level=generateLevel(num);
  board=level.board;
  par=level.par;
  tilesLeft=countTiles();

  document.getElementById('overlay').classList.remove('show');
}

// ── Draw ──
function draw(){
  const bgGrad=ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,BG_TOP);bgGrad.addColorStop(1,BG_BOT);
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

  if(gameState==='menu'){drawMenu();return;}

  ctx.save();

  if(flashAmt>0.01){ctx.fillStyle=`rgba(255,255,255,${flashAmt})`;ctx.fillRect(0,0,W,H);flashAmt*=0.85;}
  if(shakeAmt>0.5){ctx.translate((Math.random()-0.5)*shakeAmt,(Math.random()-0.5)*shakeAmt);shakeAmt*=0.86;}else shakeAmt=0;
  pulsePhase+=0.04;

  // Header
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='bold 14px system-ui';ctx.textBaseline='middle';
  ctx.fillText('LEVEL '+levelNum,bx,22);

  // Tiles left
  ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';
  ctx.fillText(tilesLeft+' left',bx,48);

  // Moves / Par
  ctx.textAlign='right';
  const overPar=moves-par;
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='bold 14px system-ui';
  ctx.fillText('PAR '+par,bx+bpx,22);
  if(moves===0){
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='bold 20px system-ui';
    ctx.fillText('0 moves',bx+bpx,48);
  } else if(overPar<=0){
    ctx.fillStyle='#55efc4';ctx.font='bold 20px system-ui';
    ctx.fillText(moves+' moves',bx+bpx,48);
  } else {
    ctx.fillStyle='#ff6b6b';ctx.font='bold 20px system-ui';
    ctx.fillText(moves+' (+'+overPar+')',bx+bpx,48);
  }
  ctx.textAlign='left';

  // Back button
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='bold 13px system-ui';
  ctx.fillText('← LEVELS',bx+bpx/2-30,22);

  // Board bg
  ctx.fillStyle=BOARD_BG;
  ctx.shadowColor='rgba(72,219,251,0.15)';ctx.shadowBlur=30;
  rrect(bx-8,by-8,bpx+16,bpx+16,16);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(72,219,251,0.2)';ctx.lineWidth=2;
  rrect(bx-8,by-8,bpx+16,bpx+16,16);ctx.stroke();

  // Grid cells
  for(let r=0;r<GRID;r++){
    for(let c=0;c<GRID;c++){
      ctx.fillStyle=board[r][c]!==null?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.015)';
      rrect(bx+c*cs+3,by+r*cs+3,cs-6,cs-6,10);ctx.fill();
    }
  }

  // Drop preview
  if(selectedDrop!==null&&hoverCell&&!isAnimating){
    const{r:hr,c:hc}=hoverCell;
    if(board[hr][hc]!==null){
      const dcol=COLORS[selectedDrop];
      ctx.fillStyle=dcol.glow;
      rrect(bx+hc*cs+3,by+hr*cs+3,cs-6,cs-6,10);ctx.fill();
      ctx.strokeStyle=dcol.fill;ctx.lineWidth=2.5;
      rrect(bx+hc*cs+1,by+hr*cs+1,cs-2,cs-2,10);ctx.stroke();
    }
  }

  // Drag preview
  let dragOffsets=null;
  if(dragStart&&dragCurrent&&!isAnimating&&selectedDrop===null&&gameState==='play'){
    const dx=dragCurrent.x-dragStart.x,dy=dragCurrent.y-dragStart.y;
    const sc=Math.floor((dragStart.x-bx)/cs),sr=Math.floor((dragStart.y-by)/cs);
    if(sr>=0&&sr<GRID&&sc>=0&&sc<GRID){
      if(Math.abs(dx)>10||Math.abs(dy)>10){
        const adx=Math.abs(dx),ady=Math.abs(dy);
        const ratio=Math.min(adx,ady)/Math.max(adx,ady);
        if(ratio>0.4&&adx>10&&ady>10){
          dragOffsets={axis:'diag',row:sr,col:sc,offsetX:Math.max(-cs,Math.min(cs,dx)),offsetY:Math.max(-cs,Math.min(cs,dy))};
        } else if(adx>ady) dragOffsets={axis:'row',idx:sr,offset:Math.max(-cs,Math.min(cs,dx))};
        else dragOffsets={axis:'col',idx:sc,offset:Math.max(-cs,Math.min(cs,dy))};
      }
    }
  }

  // Tiles
  ctx.save();
  ctx.beginPath();ctx.rect(bx,by,bpx,bpx);ctx.clip();

  for(let r=0;r<GRID;r++){
    for(let c=0;c<GRID;c++){
      if(board[r][c]===null) continue;
      let tx=bx+c*cs,ty=by+r*cs;
      if(dragOffsets){
        if(dragOffsets.axis==='row'&&r===dragOffsets.idx) tx+=dragOffsets.offset;
        else if(dragOffsets.axis==='col'&&c===dragOffsets.idx) ty+=dragOffsets.offset;
        else if(dragOffsets.axis==='diag'){
          if(r===dragOffsets.row) tx+=dragOffsets.offsetX;
          if(c===dragOffsets.col) ty+=dragOffsets.offsetY;
        }
      }
      drawTile(tx,ty,cs,board[r][c]);
    }
  }
  ctx.restore();

  // Effects
  for(const ring of rings){
    ctx.globalAlpha=ring.life*0.5;ctx.strokeStyle=ring.color;ctx.lineWidth=3*ring.life;
    ctx.beginPath();ctx.arc(ring.x,ring.y,ring.maxR*(1-ring.life),0,Math.PI*2);ctx.stroke();
  }
  ctx.globalAlpha=1;

  for(const p of particles){
    ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;

  for(const s of sparks){
    ctx.globalAlpha=Math.min(1,s.life);ctx.fillStyle=s.color;
    drawStar(s.x,s.y,s.size*s.life);
  }
  ctx.globalAlpha=1;

  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle=f.color;
    ctx.font=f.big?'bold 40px system-ui':'bold 18px system-ui';
    ctx.textAlign='center';
    if(f.big){ctx.shadowColor=f.color;ctx.shadowBlur=15;}
    ctx.fillText(f.text,f.x,f.y-(1-f.t)*45);
    ctx.shadowBlur=0;ctx.textAlign='left';
  }
  ctx.globalAlpha=1;

  // Droplet bar
  drawDropletBar();

  // Hint
  if(!isAnimating&&gameState==='play'&&selectedDrop===null){
    ctx.fillStyle=TEXT_DIM;ctx.font='12px system-ui';ctx.textAlign='center';
    ctx.fillText('Tiles wrap around — clear all to win!',W/2,invY+54);
    ctx.textAlign='left';
  }
  if(selectedDrop!==null){
    ctx.fillStyle=COLORS[selectedDrop].fill;ctx.font='bold 13px system-ui';ctx.textAlign='center';
    ctx.fillText('Tap a tile to recolor it',W/2,invY+54);
    ctx.textAlign='left';
  }

  ctx.restore();
}

function drawMenu(){
  ctx.fillStyle='#fff';ctx.font='bold 36px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='rgba(254,202,87,0.4)';ctx.shadowBlur=15;
  ctx.fillText('SLIDE',W/2,50);
  ctx.shadowBlur=0;
  ctx.fillStyle=TEXT_DIM;ctx.font='14px system-ui';
  ctx.fillText('Sliding Puzzle',W/2,78);
  ctx.textAlign='left';

  const cols=4,cellW=70,cellH=70,gap=10;
  const gridW=cols*(cellW+gap)-gap;
  const startX=Math.floor((W-gridW)/2);
  const startY=120;
  const maxLevel=getMaxLevel();

  for(let i=0;i<50;i++){
    const row=Math.floor(i/cols),col=i%cols;
    const cx=startX+col*(cellW+gap),cy=startY+row*(cellH+gap);
    if(cy+cellH<0||cy>H) continue;

    const unlocked=i+1<=maxLevel;
    const stars=highScores[i+1]||0;

    // Cell bg
    ctx.fillStyle=unlocked?'rgba(255,255,255,0.08)':'rgba(255,255,255,0.03)';
    rrect(cx,cy,cellW,cellH,12);ctx.fill();

    if(unlocked){
      ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1;
      rrect(cx,cy,cellW,cellH,12);ctx.stroke();

      // Level number
      ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(i+1),cx+cellW/2,cy+cellH/2-6);

      // Stars
      ctx.font='12px system-ui';
      ctx.fillStyle=stars>=1?'#feca57':'rgba(255,255,255,0.2)';
      const starY=cy+cellH/2+14;
      const starStr=(stars>=1?'★':'☆')+(stars>=2?'★':'☆')+(stars>=3?'★':'☆');
      ctx.fillText(starStr,cx+cellW/2,starY);
      ctx.textAlign='left';
    } else {
      // Locked
      ctx.fillStyle='rgba(255,255,255,0.15)';ctx.font='18px system-ui';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🔒',cx+cellW/2,cy+cellH/2);
      ctx.textAlign='left';
    }
  }
}

function drawTile(x,y,size,ci){
  if(ci===null) return;
  const col=COLORS[ci];
  const pad=4,r=12;

  ctx.fillStyle='rgba(0,0,0,0.25)';
  rrect(x+pad+1,y+pad+3,size-pad*2,size-pad*2,r);ctx.fill();

  const tGrad=ctx.createLinearGradient(x,y,x,y+size);
  tGrad.addColorStop(0,col.light);tGrad.addColorStop(0.5,col.fill);tGrad.addColorStop(1,col.dark);
  ctx.fillStyle=tGrad;
  rrect(x+pad,y+pad,size-pad*2,size-pad*2,r);ctx.fill();

  // Glossy highlight
  ctx.fillStyle='rgba(255,255,255,0.25)';
  const hh=(size-pad*2)*0.4;
  ctx.beginPath();
  ctx.moveTo(x+pad+r,y+pad);ctx.lineTo(x+size-pad-r,y+pad);
  ctx.quadraticCurveTo(x+size-pad,y+pad,x+size-pad,y+pad+r);
  ctx.lineTo(x+size-pad,y+pad+hh*0.5);
  ctx.quadraticCurveTo(x+size/2,y+pad+hh*1.2,x+pad,y+pad+hh*0.5);
  ctx.lineTo(x+pad,y+pad+r);ctx.quadraticCurveTo(x+pad,y+pad,x+pad+r,y+pad);
  ctx.closePath();ctx.fill();

  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=1.5;
  rrect(x+pad+1,y+pad+1,size-pad*2-2,size-pad*2-2,r-1);ctx.stroke();
}

function drawDropletBar(){
  const nc=Math.min(6,3+Math.floor(levelNum/10));
  const dropSize=36,gap=6;
  const totalW=nc*dropSize+(nc-1)*gap;
  const startX=Math.floor((W-totalW)/2);

  ctx.fillStyle=TEXT_DIM;ctx.font='bold 10px system-ui';ctx.textAlign='center';
  ctx.fillText('DROPS',W/2,invY-6);
  ctx.textAlign='left';

  for(let i=0;i<nc;i++){
    const dx=startX+i*(dropSize+gap);
    const cx=dx+dropSize/2,cy=invY+dropSize/2;
    const avail=drops[i];
    const sel=selectedDrop===i;
    const col=COLORS[i];
    const dropR=dropSize*0.35;

    ctx.fillStyle=sel?'rgba(254,202,87,0.2)':'rgba(255,255,255,0.06)';
    rrect(dx,invY,dropSize,dropSize,10);ctx.fill();

    if(sel){
      ctx.strokeStyle=ACCENT;ctx.lineWidth=2.5;
      ctx.shadowColor=ACCENT;ctx.shadowBlur=8+4*Math.sin(pulsePhase*4);
      rrect(dx,invY,dropSize,dropSize,10);ctx.stroke();
      ctx.shadowBlur=0;
    } else {
      ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;
      rrect(dx,invY,dropSize,dropSize,10);ctx.stroke();
    }

    if(avail){
      ctx.fillStyle=col.fill;
      ctx.shadowColor=col.glow;ctx.shadowBlur=8;
      drawDropShape(cx,cy,dropR);
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,255,255,0.3)';
      ctx.beginPath();ctx.arc(cx-dropR*0.2,cy-dropR*0.1,dropR*0.22,0,Math.PI*2);ctx.fill();
    } else {
      ctx.globalAlpha=0.15;
      ctx.fillStyle=col.fill;
      drawDropShape(cx,cy,dropR);
      ctx.globalAlpha=1;
    }
  }
}

function drawDropShape(cx,cy,r){
  ctx.beginPath();
  ctx.moveTo(cx,cy-r*1.3);
  ctx.quadraticCurveTo(cx+r*1.1,cy+r*0.1,cx+r*0.6,cy+r*0.7);
  ctx.quadraticCurveTo(cx,cy+r*1.3,cx-r*0.6,cy+r*0.7);
  ctx.quadraticCurveTo(cx-r*1.1,cy+r*0.1,cx,cy-r*1.3);
  ctx.closePath();ctx.fill();
}

function drawStar(x,y,s){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=Math.PI*2*i/5-Math.PI/2,a2=a+Math.PI/5;
    ctx.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s);
    ctx.lineTo(x+Math.cos(a2)*s*0.4,y+Math.sin(a2)*s*0.4);
  }
  ctx.closePath();ctx.fill();
}

function rrect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function update(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.98;p.life-=0.022;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.x+=s.vx;s.y+=s.vy;s.vy+=0.06;s.life-=0.02;
    if(s.life<=0) sparks.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){rings[i].life-=0.03;if(rings[i].life<=0)rings.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){floats[i].t-=0.015;if(floats[i].t<=0)floats.splice(i,1);}
  draw();
  requestAnimationFrame(update);
}

// ── Overlay buttons ──
document.getElementById('btn-next').onclick=()=>{startLevel(levelNum+1);};
document.getElementById('btn-retry').onclick=()=>{startLevel(levelNum);};
document.getElementById('btn-menu').onclick=()=>{showMenu();};

// Handle tap on "← LEVELS" back button during play
canvas.addEventListener('click',e=>{
  if(gameState==='play'){
    const mx=e.clientX,my=e.clientY;
    // Back button area
    if(mx>=bx+bpx/2-50&&mx<=bx+bpx/2+30&&my>=12&&my<=32){
      showMenu();
    }
  }
});

// ── Init ──
highScores=JSON.parse(localStorage.getItem('slide_scores')||'{}');
addEventListener('resize',layout);
layout();
showMenu();
update();
</script>
